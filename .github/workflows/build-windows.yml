name: Build Windows beta

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      - run: npm ci
      - run: npm run package:win
      - run: npm run portable:zip
      - uses: actions/upload-artifact@v4
        with:
          name: SkillLibraryMini-Windows-v0.9.0-beta
          path: |
            release/windows/SkillLibraryMini-Windows-Setup-x64.exe
            release/windows/SkillLibraryMini-Windows-Portable-x64.zip
          if-no-files-found: error
